name: AI Quality Gate

on:
  push:
    branches: ["**"]         # Run tests on every branch
  pull_request:
    branches: ["**"]

env:
  NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: TypeScript & Unit Tests (all branches)
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests — DIM-ICE & Schema Asserts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run Jest unit tests
        run: npm test -- --ci --passWithNoTests --coverage

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Heuristic Promptfoo Evaluation (main branch only)
  # ────────────────────────────────────────────────────────────────────────────
  promptfoo-eval:
    name: "AI Heuristic Eval — Promptfoo"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Promptfoo evaluation
        run: npx promptfoo@latest eval --config promptfoo.yaml --no-share
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: DeepEval RAG Metrics (main branch only)
  # Checks Faithfulness and Context Relevancy — must pass at ≥ 95%
  # ────────────────────────────────────────────────────────────────────────────
  deepeval-rag:
    name: "RAG Quality Gate — DeepEval/RAGAS"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DeepEval
        run: pip install deepeval
      - name: Run RAG metrics
        run: python -m pytest tests/deepeval/test_rag.py -v
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
